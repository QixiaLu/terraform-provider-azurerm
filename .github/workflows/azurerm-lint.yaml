name: AzureRM Linter

on:
  pull_request:
    paths:
      - 'internal/services/**'

jobs:
  lint:
    name: Run AzureRM Linter
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: ./.go-version

      - name: Install azurerm-linter
        run: |
          git clone https://github.com/qixialu/azurerm-linter.git /tmp/azurerm-linter
          cd /tmp/azurerm-linter
          git checkout feat-rules
          go build -o /usr/local/bin/azurerm-linter

      - name: Generate git diff
        run: |
          git diff HEAD^1 HEAD > /tmp/changes.diff
          echo "Generated diff file with $(wc -l < /tmp/changes.diff) lines"

      - name: Get changed packages
        id: changed-packages
        run: |
          changed_files=$(git diff --name-only --diff-filter=ACMRT HEAD^1 HEAD | grep '^internal/services/.*\.go$' || true)
          
          if [ -z "$changed_files" ]; then
            echo "No Go files changed in internal/services/"
            echo "packages=" >> $GITHUB_OUTPUT
            exit 0
          fi
          
          packages=$(echo "$changed_files" | sed 's|^\(internal/services/[^/]*\).*|\1|' | sort -u | sed 's|^|./|' | tr '\n' ' ')
          
          echo "Changed packages: $packages"
          echo "packages=$packages" >> $GITHUB_OUTPUT

      - name: Run linter
        if: steps.changed-packages.outputs.packages != ''
        run: azurerm-linter -diff-file=/tmp/changes.diff ${{ steps.changed-packages.outputs.packages }}