---
name: Website Linting

permissions:
  contents: read
  pull-requests: read

on:
  pull_request:
    types: ["opened", "synchronize"]
    paths:
      - ".github/workflows/website-lint.yaml"
      - "website/**"
      - "internal/services/**"

jobs:
  website-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
            fetch-depth: 2
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version-file: ./.go-version
      - run: bash scripts/gogetcookie.sh
      - name: Generate git diff
        run: |
          git diff HEAD^1 HEAD > /tmp/changes.diff
          echo "Generated diff file with $(wc -l < /tmp/changes.diff) lines"
      - name: Get changed packages
        id: changed-packages
        run: |
          changed_files=$(git diff --name-only --diff-filter=ACMRT HEAD^1 HEAD | grep '^internal/services/.*\.go$' || true)
          
          if [ -z "$changed_files" ]; then
            echo "No Go files changed in internal/services/"
            echo "packages=" >> $GITHUB_OUTPUT
            exit 0
          fi
          
          packages=$(echo "$changed_files" | sed 's|^\(internal/services/[^/]*\).*|\1|' | sort -u | sed 's|^|./|' | tr '\n' ' ')
          
          echo "Changed packages: $packages"
          echo "packages=$packages" >> $GITHUB_OUTPUT
      - run: make resource-lint RESOURCE_LINT_ARGS="$RESOURCE_LINT_ARGS"
