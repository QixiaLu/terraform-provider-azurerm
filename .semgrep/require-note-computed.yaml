rules:
  - id: require-note-for-computed-properties
    patterns:
      - pattern: |
          $FIELD: {
            ...
            Optional: true,
            ...
            Computed: true,
            ...
          }
      - pattern-not-inside: |
          // NOTE: O+C for Computed properties
          ...
    message: Add "// NOTE: O+C for Computed properties" comment above Optional+Computed schema fields
    languages: [go]
    severity: WARNING
    metadata:
      category: best-practice
      description: |
        Schema fields with both Optional and Computed set to true should have
        a NOTE comment explaining why this pattern is used.
      fix: Add the comment "// NOTE: O+C for Computed properties" above the field
