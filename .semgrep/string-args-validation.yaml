rules:
  - id: string-args-must-be-validated
    patterns:
      - pattern: |
          "$FIELD": {
            ...
            Type: schema.TypeString,
            ...
          }
      - pattern-not: |
          "$FIELD": {
            ...
            Type: schema.TypeString,
            ...
            ValidateFunc: $VALIDATE,
            ...
          }
      - pattern-not: |
          "$FIELD": {
            ...
            Type: schema.TypeString,
            Computed: true,
            ...
          }
      - pattern-not-regex: "(?s)ValidateFunc|validation\\."
    message: String arguments must be validated. Add ValidateFunc to validate the string input.
    languages: [go]
    severity: WARNING
    metadata:
      category: validation
      description: |
        All string schema fields that accept user input (Required or Optional)
        must have a ValidateFunc to ensure data integrity.
      examples:
        - |
          // Bad
          "name": {
            Type:     schema.TypeString,
            Required: true,
          }
          
          // Good
          "name": {
            Type:         schema.TypeString,
            Required:     true,
            ValidateFunc: validation.StringIsNotEmpty,
          }
