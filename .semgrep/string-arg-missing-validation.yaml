rules:
  - id: resource-id-missing-validation
    languages: [go]
    severity: WARNING
    message: String fields must include ValidateFunc.
    paths:
      include:
        - internal/services/**/*.go
    patterns:
      - pattern-either:
          - pattern-inside: "map[string]*$SCHEMA{ ... }"
      - pattern: |
          {
            Type: $SDK.TypeString,
            ...
          }
      - pattern-not: |
          {
            ...,
            Computed: true,
            ...
          }
      - pattern-not: |
          {
            ...,
            ValidateFunc: $_,
            ...
          }